[package]
name = "romserver"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["form"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
getrandom = "0.4.3"
maud = { version = "0.27.0", features = ["axum"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
scrypt = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync"] }
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
